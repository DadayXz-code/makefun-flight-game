<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Courier — a little airmail flight game</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="stage">
  <canvas id="game" width="1280" height="720" aria-label="Sky Courier flight game"></canvas>
  <div class="touch" aria-hidden="true">
    <button type="button" data-touch="up" aria-label="Climb">▲</button>
    <button type="button" data-touch="down" aria-label="Descend">▼</button>
    <button type="button" data-touch="slow" aria-label="Less throttle">− THR</button>
    <button type="button" data-touch="fast" aria-label="More throttle">+ THR</button>
  </div>
  <p class="hint">Fly with ↑ ↓ to climb and dive, ← → for throttle · P pauses · M mutes · 1/2/3 picks a mission</p>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
